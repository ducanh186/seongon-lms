<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEONGON Learning - Nền tảng học tập Search Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0057FF;
  --primary-dark:#0043CC;
  --primary-light:#EAF0FF;
  --primary-gradient:linear-gradient(135deg,#0057FF 0%,#00A3FF 100%);
  --dark:#0B1220;
  --text:#1F2937;
  --text-muted:#64748B;
  --border:#E2E8F0;
  --border-light:#F1F5F9;
  --bg:#FFFFFF;
  --bg-soft:#F5F8FF;
  --bg-alt:#F8FAFC;
  --warning:#F59E0B;
  --success:#16A34A;
  --danger:#DC2626;
  --shadow-sm:0 1px 2px rgba(11,18,32,.04);
  --shadow:0 4px 12px rgba(11,18,32,.06);
  --shadow-lg:0 12px 32px rgba(11,18,32,.10);
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --font:'Roboto',Arial,sans-serif;
}
html,body{font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
h1,h2,h3,h4{color:var(--dark);font-weight:700;line-height:1.25}

/* ============ UTILS ============ */
.container{max-width:1280px;margin:0 auto;padding:0 24px}
.flex{display:flex}
.between{justify-content:space-between}
.center{align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.hidden{display:none !important}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.text-muted{color:var(--text-muted)}
.text-sm{font-size:13px}
.text-xs{font-size:12px}
.text-center{text-align:center}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:all .18s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark);text-decoration:none}
.btn-outline{background:#fff;color:var(--primary);border-color:var(--primary)}
.btn-outline:hover{background:var(--primary-light);text-decoration:none}
.btn-ghost{background:transparent;color:var(--text)}
.btn-ghost:hover{background:var(--bg-alt)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{opacity:.9}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:14px 28px;font-size:15px}
.btn-block{width:100%}
.btn-icon{padding:8px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============ FORM ============ */
.form-group{margin-bottom:16px}
.form-label{display:block;font-weight:500;font-size:13px;margin-bottom:6px;color:var(--dark)}
.form-control{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;transition:border-color .15s,box-shadow .15s}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(0,87,255,.12)}
.form-error{color:var(--danger);font-size:12px;margin-top:4px;display:none}
.form-error.show{display:block}
textarea.form-control{min-height:90px;resize:vertical}
select.form-control{cursor:pointer}

/* ============ BADGE ============ */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.badge-primary{background:var(--primary-light);color:var(--primary)}
.badge-success{background:#DCFCE7;color:#166534}
.badge-warning{background:#FEF3C7;color:#92400E}
.badge-danger{background:#FEE2E2;color:#991B1B}
.badge-gray{background:var(--border-light);color:var(--text-muted)}

/* ============ CARD ============ */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.card-hover{transition:transform .2s,box-shadow .2s}
.card-hover:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}

/* ============ HEADER PUBLIC ============ */
.header{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--dark)}
.logo-mark{width:36px;height:36px;background:var(--primary-gradient);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.logo-text b{color:var(--primary)}
.nav-menu{display:flex;gap:8px;align-items:center}
.nav-item{padding:8px 14px;border-radius:var(--radius-sm);color:var(--text);font-weight:500;font-size:14px;cursor:pointer;transition:background .15s}
.nav-item:hover{background:var(--bg-alt);text-decoration:none;color:var(--dark)}
.nav-item.active{color:var(--primary);background:var(--primary-light)}
.nav-actions{display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-gradient);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;user-select:none;position:relative}
.avatar-menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);min-width:200px;padding:6px;z-index:200}
.avatar-menu-item{padding:10px 14px;border-radius:6px;font-size:14px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:8px}
.avatar-menu-item:hover{background:var(--bg-alt)}
.avatar-menu-header{padding:12px 14px;border-bottom:1px solid var(--border-light);margin-bottom:6px}
.avatar-menu-header .name{font-weight:600;color:var(--dark);font-size:14px}
.avatar-menu-header .email{font-size:12px;color:var(--text-muted)}

/* ============ HERO ============ */
.hero{background:linear-gradient(180deg,#F5F8FF 0%,#FFFFFF 100%);padding:80px 0 60px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-100px;right:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,87,255,.08) 0%,transparent 70%);border-radius:50%}
.hero-inner{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center;position:relative}
.hero-tag{display:inline-flex;align-items:center;gap:8px;background:var(--primary-light);color:var(--primary);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;margin-bottom:20px}
.hero-tag::before{content:"";width:6px;height:6px;background:var(--primary);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero h1{font-size:44px;line-height:1.15;margin-bottom:20px;letter-spacing:-.02em}
.hero h1 .accent{background:var(--primary-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:17px;color:var(--text-muted);margin-bottom:32px;max-width:520px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap}

/* Hero visual (fake dashboard card) */
.hero-visual{position:relative;height:420px}
.hero-card{position:absolute;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:20px}
.hero-card-main{top:20px;left:20px;right:20px;bottom:20px;padding:24px}
.hero-card-main .mini-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hero-card-main .mini-title{font-size:18px;font-weight:700;color:var(--dark);margin:6px 0 20px}
.mini-progress-item{margin-bottom:16px}
.mini-progress-label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--text)}
.mini-progress-bar{height:6px;background:var(--border-light);border-radius:999px;overflow:hidden}
.mini-progress-fill{height:100%;background:var(--primary-gradient);border-radius:999px}
.hero-card-float{top:-10px;right:0;padding:14px 18px;display:flex;align-items:center;gap:12px;animation:float 3s ease-in-out infinite}
.hero-card-float-2{bottom:0;left:-10px;padding:14px 18px;display:flex;align-items:center;gap:12px;animation:float 3s ease-in-out infinite reverse}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.float-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.float-icon.blue{background:var(--primary-gradient)}
.float-icon.green{background:linear-gradient(135deg,#16A34A,#4ADE80)}

/* ============ SECTIONS ============ */
.section{padding:80px 0}
.section-alt{background:var(--bg-soft)}
.section-eyebrow{color:var(--primary);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.section-title{font-size:34px;letter-spacing:-.02em;margin-bottom:14px}
.section-sub{font-size:16px;color:var(--text-muted);max-width:640px;margin-bottom:40px}
.section-head-flex{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;margin-bottom:40px}
.section-head-flex .section-sub{margin-bottom:0}

/* stats strip */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding:40px;background:var(--dark);border-radius:var(--radius-lg);color:#fff;margin-top:-40px;position:relative;z-index:2}
.stat-item .stat-value{font-size:32px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 0%,#93C5FD 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-item .stat-label{font-size:13px;color:rgba(255,255,255,.7);margin-top:4px}

/* categories */
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.category-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s}
.category-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.category-icon{width:44px;height:44px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700}
.category-card h4{font-size:16px}
.category-card .count{font-size:12px;color:var(--text-muted)}

/* course grid */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.course-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:all .2s;cursor:pointer;display:flex;flex-direction:column}
.course-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.course-thumb{height:150px;background:var(--primary-gradient);position:relative;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px}
.course-thumb.style-1{background:linear-gradient(135deg,#0057FF 0%,#00A3FF 100%)}
.course-thumb.style-2{background:linear-gradient(135deg,#7C3AED 0%,#0057FF 100%)}
.course-thumb.style-3{background:linear-gradient(135deg,#0EA5E9 0%,#0057FF 100%)}
.course-thumb.style-4{background:linear-gradient(135deg,#0057FF 0%,#8B5CF6 100%)}
.course-thumb.style-5{background:linear-gradient(135deg,#0B1220 0%,#0057FF 100%)}
.course-thumb.style-6{background:linear-gradient(135deg,#0057FF 0%,#16A34A 100%)}
.course-thumb-text{font-size:22px;font-weight:800;text-align:center;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.course-thumb-badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);color:var(--dark);padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700}
.course-body{padding:18px;flex:1;display:flex;flex-direction:column}
.course-title{font-size:16px;font-weight:700;color:var(--dark);margin-bottom:8px;line-height:1.35;min-height:44px}
.course-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-bottom:12px}
.course-meta span{display:inline-flex;align-items:center;gap:4px}
.course-rating{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px}
.course-rating .stars{color:var(--warning);font-weight:700}
.course-rating .review-count{color:var(--text-muted)}
.course-price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--border-light)}
.course-price{font-size:17px;font-weight:800;color:var(--dark)}
.course-price.free{color:var(--success)}
.progress-bar{height:6px;background:var(--border-light);border-radius:999px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--primary-gradient);transition:width .3s}

/* Filters */
.filter-bar{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:24px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:16px}
.filter-search{position:relative}
.filter-search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--border);border-radius:var(--radius-sm)}
.filter-search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}

/* ============ FOOTER ============ */
.footer{background:var(--dark);color:#94A3B8;padding:60px 0 30px;margin-top:80px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.footer h4{color:#fff;font-size:14px;margin-bottom:16px;text-transform:uppercase;letter-spacing:.05em}
.footer-links{display:flex;flex-direction:column;gap:8px}
.footer-links a{color:#94A3B8;font-size:14px}
.footer-links a:hover{color:#fff;text-decoration:none}
.footer-brand p{font-size:14px;margin-top:16px;max-width:340px}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1);padding-top:24px;text-align:center;font-size:13px}

/* ============ ADMIN & STUDENT LAYOUT ============ */
.app-layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:var(--dark);color:#94A3B8;padding:20px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar-brand{padding:0 24px 20px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:16px}
.sidebar-brand .logo{color:#fff}
.sidebar-section-label{padding:16px 24px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#64748B;font-weight:600}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:11px 24px;color:#94A3B8;cursor:pointer;font-size:14px;transition:all .15s;border-left:3px solid transparent}
.sidebar-item:hover{background:rgba(255,255,255,.04);color:#fff;text-decoration:none}
.sidebar-item.active{background:rgba(0,87,255,.15);color:#fff;border-left-color:var(--primary)}
.sidebar-item .ico{width:20px;text-align:center}

.app-main{background:var(--bg-alt);min-height:100vh}
.app-topbar{background:#fff;border-bottom:1px solid var(--border);padding:14px 32px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.app-topbar h1{font-size:19px;font-weight:700}
.app-content{padding:32px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:32px}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kpi-card .kpi-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:8px}
.kpi-card .kpi-value{font-size:28px;font-weight:800;color:var(--dark);letter-spacing:-.02em}
.kpi-card .kpi-change{font-size:12px;color:var(--success);margin-top:4px;font-weight:600}
.kpi-card .kpi-change.neg{color:var(--danger)}
.kpi-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary);font-size:18px}
.kpi-icon.green{background:#DCFCE7;color:var(--success)}
.kpi-icon.amber{background:#FEF3C7;color:var(--warning)}
.kpi-icon.purple{background:#EDE9FE;color:#7C3AED}

/* Charts placeholder */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:24px;margin-bottom:32px}
.chart-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.chart-card h3{font-size:16px;margin-bottom:20px}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding:12px 0;border-bottom:1px solid var(--border-light)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.bar{width:100%;background:var(--primary-gradient);border-radius:6px 6px 0 0;position:relative;min-height:4px;transition:all .3s}
.bar:hover{opacity:.85}
.bar-value{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--dark);opacity:0;transition:opacity .15s}
.bar-col:hover .bar-value{opacity:1}
.bar-label{font-size:11px;color:var(--text-muted);margin-top:6px}
.donut{width:180px;height:180px;border-radius:50%;background:conic-gradient(var(--primary) 0% 68%,var(--border-light) 68% 100%);position:relative;margin:0 auto}
.donut::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:50%}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:2}
.donut-center .val{font-size:28px;font-weight:800;color:var(--dark)}
.donut-center .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
.donut-legend{display:flex;justify-content:center;gap:20px;margin-top:20px;font-size:12px;color:var(--text-muted)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* Table */
.data-table{width:100%;background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.data-table table{width:100%;border-collapse:collapse}
.data-table th{background:var(--bg-alt);text-align:left;padding:12px 16px;font-size:12px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.data-table td{padding:14px 16px;border-bottom:1px solid var(--border-light);font-size:14px;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:var(--bg-alt)}
.table-toolbar{background:#fff;border:1px solid var(--border);border-bottom:none;border-radius:var(--radius) var(--radius) 0 0;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.table-toolbar+.data-table{border-radius:0 0 var(--radius) var(--radius);border-top:none}
.table-search{position:relative;flex:1;max-width:320px}
.table-search input{width:100%;padding:8px 14px 8px 36px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px}
.table-search::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;font-size:13px}
.table-actions{display:flex;gap:8px;align-items:center}
.row-actions{display:flex;gap:6px}

/* ============ MODAL ============ */
.modal-backdrop{position:fixed;inset:0;background:rgba(11,18,32,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:18px}
.modal-close{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text-muted)}
.modal-close:hover{background:var(--bg-alt)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px}

/* ============ TOAST ============ */
.toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px}
.toast{background:#fff;border-left:4px solid var(--primary);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:14px 18px;min-width:280px;max-width:400px;display:flex;align-items:flex-start;gap:12px;animation:slideIn .3s ease-out}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast-icon{font-size:18px;flex-shrink:0}
.toast-body{flex:1}
.toast-title{font-weight:600;font-size:14px;color:var(--dark);margin-bottom:2px}
.toast-msg{font-size:13px;color:var(--text-muted)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ AUTH PAGES ============ */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-visual{background:var(--primary-gradient);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-visual::before{content:"";position:absolute;bottom:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:rgba(255,255,255,.08)}
.auth-visual .logo{color:#fff;position:relative}
.auth-visual .logo-mark{background:rgba(255,255,255,.2);backdrop-filter:blur(10px)}
.auth-visual-content{position:relative}
.auth-visual h2{color:#fff;font-size:32px;line-height:1.2;margin-bottom:16px;letter-spacing:-.01em}
.auth-visual p{opacity:.9;font-size:16px;max-width:400px}
.auth-visual-stats{position:relative;display:flex;gap:32px}
.auth-visual-stats .n{font-size:28px;font-weight:800}
.auth-visual-stats .l{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:60px 40px}
.auth-form{width:100%;max-width:400px}
.auth-form h1{font-size:28px;margin-bottom:8px}
.auth-form .lead{color:var(--text-muted);margin-bottom:32px}
.auth-alt{text-align:center;margin-top:24px;font-size:14px;color:var(--text-muted)}
.auth-demo-box{background:var(--bg-soft);border:1px solid var(--primary-light);border-radius:var(--radius);padding:14px;margin-top:20px;font-size:13px;color:var(--text-muted)}
.auth-demo-box b{color:var(--dark)}

/* ============ COURSE DETAIL ============ */
.course-detail-header{background:var(--dark);color:#fff;padding:60px 0}
.course-detail-inner{display:grid;grid-template-columns:1.5fr 1fr;gap:60px}
.course-detail-header h1{color:#fff;font-size:32px;margin:16px 0}
.course-detail-header .instructor{color:rgba(255,255,255,.75);font-size:14px;margin-top:16px}
.course-detail-header .instructor b{color:#fff}
.course-detail-meta{display:flex;flex-wrap:wrap;gap:16px;color:rgba(255,255,255,.85);font-size:14px;margin-top:16px}
.course-detail-meta span{display:inline-flex;align-items:center;gap:6px}
.course-cta-card{background:#fff;color:var(--text);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.course-cta-card .cta-thumb{height:180px;margin:-24px -24px 20px;background:var(--primary-gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;text-align:center;padding:20px}
.course-cta-card .price{font-size:32px;font-weight:800;color:var(--dark);margin-bottom:16px}
.course-cta-features{list-style:none;margin:20px 0;padding:0}
.course-cta-features li{padding:6px 0;font-size:13px;color:var(--text-muted);display:flex;gap:8px}
.course-cta-features li::before{content:"✓";color:var(--success);font-weight:700}
.course-body-section{padding:60px 0}
.course-two-col{display:grid;grid-template-columns:1.6fr 1fr;gap:40px}
.lesson-list{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lesson-item{padding:14px 18px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:14px;font-size:14px}
.lesson-item:last-child{border-bottom:none}
.lesson-num{width:28px;height:28px;background:var(--primary-light);color:var(--primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.lesson-item .lesson-title-t{flex:1;color:var(--dark);font-weight:500}
.lesson-item .lesson-dur{font-size:12px;color:var(--text-muted)}
.section-heading{font-size:22px;margin-bottom:20px}
.outcomes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.outcomes-grid div{display:flex;gap:10px;font-size:14px;color:var(--text)}
.outcomes-grid div::before{content:"✓";color:var(--success);font-weight:700}
.review-item{padding:16px 0;border-bottom:1px solid var(--border-light)}
.review-item:last-child{border-bottom:none}
.review-head{display:flex;justify-content:space-between;margin-bottom:6px}
.review-name{font-weight:600;font-size:14px;color:var(--dark)}
.review-stars{color:var(--warning);font-size:13px}
.review-comment{font-size:14px;color:var(--text)}
.review-date{font-size:12px;color:var(--text-muted);margin-top:4px}

/* ============ LEARNING (VIDEO) LAYOUT ============ */
.learn-layout{display:grid;grid-template-columns:1fr 320px;min-height:100vh;background:#0B1220}
.learn-main{padding:0 40px 40px;overflow-y:auto}
.learn-topbar{padding:16px 40px;margin:0 -40px 24px;background:#0B1220;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;color:#fff;position:sticky;top:0;z-index:10}
.learn-topbar h2{color:#fff;font-size:16px}
.learn-topbar-back{color:#94A3B8;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
.learn-topbar-back:hover{color:#fff}
.video-placeholder{background:#000;aspect-ratio:16/9;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;color:#fff;position:relative;margin-bottom:24px;overflow:hidden}
.video-placeholder::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,87,255,.3),rgba(11,18,32,.9))}
.video-play{width:80px;height:80px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;position:relative;z-index:2;border:2px solid rgba(255,255,255,.3)}
.video-title-strip{position:absolute;bottom:20px;left:24px;right:24px;z-index:2}
.video-title-strip .subtitle{font-size:12px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:.05em}
.video-title-strip .title{font-size:20px;font-weight:700;margin-top:4px}
.learn-content-card{background:#fff;border-radius:var(--radius-lg);padding:28px;margin-bottom:20px}
.learn-content-card h2{margin-bottom:14px}
.learn-content-card p{color:var(--text-muted);margin-bottom:12px}
.material-list{margin-top:20px}
.material-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-alt);border-radius:var(--radius-sm);margin-bottom:8px;font-size:14px}
.material-icon{width:36px;height:36px;background:var(--primary-light);color:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.learn-actions{display:flex;justify-content:space-between;background:#fff;border-radius:var(--radius);padding:16px 20px;margin-top:16px;gap:12px}
.learn-sidebar{background:#111827;color:#94A3B8;padding:24px;overflow-y:auto;border-left:1px solid rgba(255,255,255,.06)}
.learn-sidebar h3{color:#fff;font-size:15px;margin-bottom:8px}
.learn-sidebar-progress{margin:16px 0 24px}
.learn-sidebar-progress .label{font-size:12px;color:#94A3B8;display:flex;justify-content:space-between;margin-bottom:6px}
.learn-lesson-item{padding:12px 14px;border-radius:8px;margin-bottom:6px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
.learn-lesson-item:hover{background:rgba(255,255,255,.04)}
.learn-lesson-item.active{background:rgba(0,87,255,.2);border:1px solid rgba(0,87,255,.4)}
.learn-lesson-icon{width:24px;height:24px;border-radius:50%;border:1.5px solid #64748B;display:flex;align-items:center;justify-content:center;font-size:11px;color:#94A3B8;flex-shrink:0}
.learn-lesson-item.done .learn-lesson-icon{background:var(--success);border-color:var(--success);color:#fff}
.learn-lesson-title{font-size:13px;color:#CBD5E1;line-height:1.4;flex:1}
.learn-lesson-item.active .learn-lesson-title{color:#fff;font-weight:500}
.learn-lesson-dur{font-size:11px;color:#64748B}

/* ============ QUIZ ============ */
.quiz-wrap{max-width:800px;margin:40px auto;padding:0 24px}
.quiz-card{background:#fff;border-radius:var(--radius-lg);padding:32px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;color:var(--text-muted)}
.quiz-question{margin-bottom:32px}
.quiz-question .qnum{font-size:12px;color:var(--primary);text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin-bottom:8px}
.quiz-question h3{font-size:18px;margin-bottom:20px;line-height:1.4}
.quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-option{padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;font-size:14px}
.quiz-option:hover{border-color:var(--primary);background:var(--primary-light)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-light);color:var(--dark)}
.quiz-option.correct{border-color:var(--success);background:#DCFCE7}
.quiz-option.wrong{border-color:var(--danger);background:#FEE2E2}
.quiz-radio{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff}
.quiz-option.selected .quiz-radio{border-color:var(--primary)}
.quiz-option.selected .quiz-radio::after{content:"";width:10px;height:10px;background:var(--primary);border-radius:50%}
.quiz-result-card{text-align:center;padding:40px}
.quiz-result-icon{width:100px;height:100px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:52px}
.quiz-result-icon.pass{background:#DCFCE7;color:var(--success)}
.quiz-result-icon.fail{background:#FEE2E2;color:var(--danger)}
.quiz-score{font-size:48px;font-weight:800;color:var(--dark);letter-spacing:-.02em}
.quiz-result-detail{color:var(--text-muted);margin:8px 0 24px}

/* ============ CERTIFICATE ============ */
.cert-wrap{max-width:900px;margin:40px auto;padding:0 24px}
.certificate{background:#fff;border:14px solid var(--primary);border-radius:8px;padding:60px 50px;position:relative;text-align:center;box-shadow:var(--shadow-lg);background-image:radial-gradient(circle at 10% 10%,rgba(0,87,255,.04),transparent 40%),radial-gradient(circle at 90% 90%,rgba(0,163,255,.04),transparent 40%)}
.cert-corner{position:absolute;width:60px;height:60px;border:3px solid var(--primary)}
.cert-corner.tl{top:15px;left:15px;border-right:none;border-bottom:none}
.cert-corner.tr{top:15px;right:15px;border-left:none;border-bottom:none}
.cert-corner.bl{bottom:15px;left:15px;border-right:none;border-top:none}
.cert-corner.br{bottom:15px;right:15px;border-left:none;border-top:none}
.cert-logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--dark);margin-bottom:20px}
.cert-logo-mark{width:44px;height:44px;background:var(--primary-gradient);border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.cert-eyebrow{color:var(--primary);text-transform:uppercase;letter-spacing:.15em;font-size:13px;font-weight:600;margin-bottom:8px}
.cert-title{font-size:38px;font-family:Georgia,serif;font-weight:700;color:var(--dark);margin-bottom:24px;letter-spacing:-.01em}
.cert-body{font-size:16px;color:var(--text-muted);margin-bottom:20px}
.cert-name{font-size:36px;font-family:Georgia,serif;font-style:italic;color:var(--primary);border-bottom:1px solid var(--border);display:inline-block;padding:0 40px 8px;margin:16px 0 20px}
.cert-course-name{font-size:20px;font-weight:700;color:var(--dark);margin-bottom:30px}
.cert-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px;padding-top:24px;border-top:1px dashed var(--border)}
.cert-sig{text-align:left;font-size:12px;color:var(--text-muted)}
.cert-sig .n{font-family:Georgia,serif;font-style:italic;font-size:18px;color:var(--dark);margin-bottom:4px}
.cert-actions{text-align:center;margin-top:24px}

/* ============ V2 ADDITIONS ============ */
/* Cart button in header */
.cart-btn{position:relative;width:40px;height:40px;border-radius:50%;background:var(--bg-alt);color:var(--dark);display:flex;align-items:center;justify-content:center;transition:background .15s}
.cart-btn:hover{background:var(--primary-light);text-decoration:none}
.cart-btn svg{width:20px;height:20px}
.cart-badge{position:absolute;top:-2px;right:-4px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff}

/* Page banner */
.page-banner{background:linear-gradient(135deg,#0057FF 0%,#0043CC 60%,#001E5C 100%);color:#fff;padding:50px 0;position:relative;overflow:hidden}
.page-banner::before{content:"";position:absolute;top:-50px;right:-50px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);border-radius:50%}
.page-banner::after{content:"";position:absolute;bottom:-100px;left:30%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,163,255,.15),transparent 70%);border-radius:50%}
.page-banner-inner{position:relative;display:grid;grid-template-columns:1.5fr auto;align-items:center;gap:40px}
.page-banner h1{color:#fff;font-size:32px;letter-spacing:-.01em;margin-bottom:8px;line-height:1.2}
.page-banner p{color:rgba(255,255,255,.85);font-size:15px;max-width:520px}
.page-banner-visual{width:180px;height:120px;opacity:.9}
.page-banner-visual svg{width:100%;height:100%}
.breadcrumb{display:flex;gap:8px;font-size:13px;color:rgba(255,255,255,.7);margin-bottom:14px;align-items:center}
.breadcrumb a{color:rgba(255,255,255,.85)}
.breadcrumb a:hover{color:#fff}
.breadcrumb span{opacity:.5}

/* Admin banner (lighter) */
.admin-banner{background:linear-gradient(135deg,#0057FF,#0043CC);color:#fff;padding:32px;border-radius:var(--radius-lg);margin-bottom:28px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px}
.admin-banner::before{content:"";position:absolute;right:-30px;bottom:-30px;width:180px;height:180px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
.admin-banner h2{color:#fff;font-size:22px;margin-bottom:6px;position:relative}
.admin-banner p{color:rgba(255,255,255,.85);font-size:14px;position:relative;max-width:560px}
.admin-banner-visual{width:120px;height:80px;position:relative;opacity:.95}

/* Course thumbnail SVG wrapper */
.course-thumb{position:relative;background:linear-gradient(135deg,#0057FF 0%,#0043CC 100%)}
.course-thumb-svg{position:absolute;inset:0;width:100%;height:100%}
.course-thumb-svg svg{width:100%;height:100%;display:block}
.course-thumb-content{position:relative;z-index:2;text-align:left;padding:20px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.course-thumb-content .course-thumb-badge{position:static;background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px);align-self:flex-start;font-weight:600}
.course-thumb-content .course-thumb-text{font-size:18px;font-weight:700;color:#fff;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,.25);max-width:80%}
.course-thumb-content .course-thumb-cat{font-size:11px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:6px}

/* Cart page */
.cart-list-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:grid;grid-template-columns:120px 1fr auto auto;gap:20px;align-items:center;margin-bottom:12px}
.cart-thumb{width:120px;height:80px;border-radius:var(--radius-sm);overflow:hidden;position:relative;background:var(--primary-gradient)}
.cart-thumb svg{width:100%;height:100%}
.cart-item-info h4{font-size:15px;margin-bottom:4px}
.cart-item-info .meta{font-size:12px;color:var(--text-muted)}
.cart-item-price{font-size:16px;font-weight:700;color:var(--primary)}
.cart-summary{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;position:sticky;top:100px}
.cart-summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.cart-summary-row.total{border-top:1px dashed var(--border);padding-top:16px;margin-top:8px;font-size:18px;font-weight:700}
.cart-summary-row.total b{color:var(--primary)}

/* Payment method picker */
.payment-methods{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0}
.payment-method{padding:14px 10px;border:1.5px solid var(--border);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:all .15s}
.payment-method:hover{border-color:var(--primary)}
.payment-method.selected{border-color:var(--primary);background:var(--primary-light)}
.payment-method svg{width:28px;height:28px;margin:0 auto 6px;display:block}
.payment-method .pm-label{font-size:12px;font-weight:600;color:var(--dark)}

/* Blog */
.blog-hero{background:linear-gradient(135deg,#0B1220 0%,#0057FF 100%);color:#fff;padding:70px 0;position:relative;overflow:hidden}
.blog-hero::after{content:"";position:absolute;right:-100px;top:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(0,163,255,.25),transparent 70%);border-radius:50%}
.blog-hero-inner{position:relative;max-width:720px}
.blog-hero .eyebrow{font-size:12px;color:#93C5FD;text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:12px}
.blog-hero h1{color:#fff;font-size:38px;letter-spacing:-.02em;margin-bottom:14px}
.blog-hero p{color:rgba(255,255,255,.85);font-size:16px;max-width:560px}
.blog-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.blog-filter-chip{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;background:#fff;border:1px solid var(--border);cursor:pointer;transition:all .15s}
.blog-filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.blog-filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
.blog-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.blog-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.blog-card-thumb{height:180px;position:relative;overflow:hidden;background:var(--primary-gradient)}
.blog-card-thumb svg{width:100%;height:100%}
.blog-card-body{padding:20px;flex:1;display:flex;flex-direction:column}
.blog-card-cat{font-size:11px;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:8px}
.blog-card h3{font-size:17px;margin-bottom:10px;line-height:1.35;color:var(--dark)}
.blog-card p{font-size:13px;color:var(--text-muted);line-height:1.55;margin-bottom:14px;flex:1}
.blog-card-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);padding-top:12px;border-top:1px solid var(--border-light)}
.blog-detail-hero{height:340px;position:relative;overflow:hidden;background:var(--primary-gradient)}
.blog-detail-hero svg{width:100%;height:100%;position:absolute;inset:0}
.blog-detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,18,32,.8) 100%);display:flex;align-items:flex-end;padding:40px 0}
.blog-detail-hero-content{color:#fff;max-width:900px;margin:0 auto;padding:0 24px;width:100%}
.blog-detail-content{max-width:820px;margin:0 auto;padding:60px 24px}
.blog-detail-content h1{font-size:32px;margin-bottom:16px;letter-spacing:-.01em}
.blog-detail-content .body{font-size:16px;line-height:1.8;color:var(--text)}
.blog-detail-content .body p{margin-bottom:16px}

/* Section eyebrow with light accent line */
.section-eyebrow{display:inline-flex;align-items:center;gap:10px}
.section-eyebrow::before{content:"";width:24px;height:2px;background:var(--primary);border-radius:2px}

/* ============ WIZARD - COURSE CREATION ============ */
.wizard-overlay{position:fixed;inset:0;background:rgba(11,18,32,.55);z-index:9998;display:flex;align-items:flex-start;justify-content:center;padding:32px;overflow-y:auto;animation:fadeIn .15s ease}
.wizard-panel{background:#F8FAFC;width:100%;max-width:1080px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;min-height:60vh;margin:auto 0}
.wizard-header{padding:20px 28px;background:#fff;border-bottom:1px solid var(--border);border-radius:var(--radius-lg) var(--radius-lg) 0 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.wizard-header h2{font-size:20px;margin:0}
.wizard-header .wz-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.wizard-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:20px 28px;background:#fff;border-bottom:1px solid var(--border-light)}
.wz-step{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--bg-alt);transition:all .15s;position:relative}
.wz-step .wz-num{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--text-muted);border:1.5px solid var(--border);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.wz-step .wz-label{font-size:12px;font-weight:600;color:var(--text-muted);line-height:1.3}
.wz-step.active{background:var(--primary-light)}
.wz-step.active .wz-num{background:var(--primary);color:#fff;border-color:var(--primary)}
.wz-step.active .wz-label{color:var(--primary)}
.wz-step.done .wz-num{background:var(--success);color:#fff;border-color:var(--success)}
.wz-step.done .wz-label{color:var(--dark)}
.wizard-body{padding:28px;flex:1}
.wizard-footer{padding:16px 28px;background:#fff;border-top:1px solid var(--border);border-radius:0 0 var(--radius-lg) var(--radius-lg);display:flex;justify-content:space-between;position:sticky;bottom:0}
.wizard-footer .wz-status{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:8px}
.wizard-close{background:transparent;border:0;font-size:22px;cursor:pointer;color:var(--text-muted);width:36px;height:36px;border-radius:6px}
.wizard-close:hover{background:var(--bg-alt);color:var(--dark)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.status-pill.DRAFT{background:#FEF3C7;color:#92400E}
.status-pill.PUBLISHED{background:#DCFCE7;color:#166534}
.status-pill.HIDDEN{background:#F1F5F9;color:#475569}
.status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Lesson editor list */
.lesson-editor-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.lesson-editor-num{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.lesson-editor-info h4{font-size:14px;margin-bottom:4px}
.lesson-editor-info .meta{font-size:12px;color:var(--text-muted)}
.lesson-editor-actions{display:flex;gap:6px}

/* Question editor */
.qn-editor-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px}
.qn-editor-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.qn-editor-content{font-size:14px;font-weight:600}
.qn-editor-options{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;font-size:13px}
.qn-editor-option{padding:6px 10px;background:var(--bg-alt);border-radius:6px}
.qn-editor-option.correct{background:#DCFCE7;color:#166534;font-weight:600}

/* Review card */
.review-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.checklist{list-style:none;padding:0}
.checklist li{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border-light)}
.checklist li:last-child{border-bottom:none}
.check-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.check-icon.ok{background:#DCFCE7;color:#166534}
.check-icon.no{background:#FEE2E2;color:#991B1B}

@media(max-width:900px){
  .wizard-steps{grid-template-columns:1fr 1fr}
  .wizard-overlay{padding:12px}
}
/* ============ END WIZARD ============ */

/* ============ RESPONSIVE ============ */
@media(max-width:1024px){

/* ---------- STATE (localStorage) ---------- */
let STATE = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      // Ensure required keys exist (migration for older state)
      if(!s.users) s.users=[DEFAULT_ADMIN,DEFAULT_STUDENT];
      if(!s.courses) s.courses=JSON.parse(JSON.stringify(MOCK_COURSES));
      if(!s.categories) s.categories=[...CATEGORIES];
      if(!s.enrollments) s.enrollments=[];
      if(!s.reviews) s.reviews=[];
      if(!s.quizResults) s.quizResults=[];
      if(!s.quizzes) s.quizzes={};
      if(!s.cartItems) s.cartItems=[];
      if(!s.blogPosts) s.blogPosts=JSON.parse(JSON.stringify(MOCK_BLOG_POSTS));
      // Migration status khóa học: active -> PUBLISHED, hidden -> HIDDEN
      s.courses.forEach(c=>{
        if(!c.status || c.status==='active') c.status='PUBLISHED';
        else if(c.status==='hidden') c.status='HIDDEN';
        else if(c.status==='draft') c.status='DRAFT';
        // Nếu đã đúng format DRAFT/PUBLISHED/HIDDEN thì giữ nguyên
        if(!['DRAFT','PUBLISHED','HIDDEN'].includes(c.status)) c.status='PUBLISHED';
      });
      return s;
    }
  }catch(e){console.warn('loadState error',e)}
  return initState();
}
function initState(){
  const s = {
    users:[DEFAULT_ADMIN,DEFAULT_STUDENT],
    courses:JSON.parse(JSON.stringify(MOCK_COURSES)),
    categories:[...CATEGORIES],

function toast(type,title,msg){
  const el = document.createElement('div');

/* Course helpers */
function getCourse(id){return STATE.courses.find(c=>c.id===id)}
function getEnrollment(courseId,userId){userId=userId||STATE.currentUser?.id;return STATE.enrollments.find(e=>e.courseId===courseId && e.userId===userId)}
function courseRating(courseId){
  const rs=STATE.reviews.filter(r=>r.courseId===courseId);
  if(!rs.length){const c=getCourse(courseId);return {avg:c?.rating||0,count:c?.reviewCount||0}}
  const avg=rs.reduce((s,r)=>s+r.rating,0)/rs.length;
  return {avg:Math.round(avg*10)/10,count:rs.length};
}
function courseProgress(courseId,userId){
  const en=getEnrollment(courseId,userId);
  if(!en) return 0;
  const c=getCourse(courseId);
  if(!c||!c.lessons.length) return 0;
  return Math.round(en.progress.completed.length/c.lessons.length*100);
}
function isCourseComplete(courseId,userId){return courseProgress(courseId,userId)===100}
function hasPassedQuiz(courseId,userId){
  userId=userId||STATE.currentUser?.id;
  return STATE.quizResults.some(q=>q.courseId===courseId && q.userId===userId && q.passed);
}
function hasCertificate(courseId,userId){return isCourseComplete(courseId,userId) && hasPassedQuiz(courseId,userId)}

function route(hash){
  if(hash) location.hash=hash;
  const h=location.hash||'#/';
  const parts=h.split('/');
  // Detect base route: admin sub-routes (2 levels), blog-detail, else 1 level
  let base;
  if(parts[1]==='admin' && parts[2]) base='#/admin/'+parts[2];
  else if(parts[1]==='blog-detail') base='#/blog-detail';
  else base='#/'+(parts[1]||'');
  // Redirect deprecated admin routes (lessons/quiz đã chuyển vào wizard khóa học)
  if(base==='#/admin/lessons' || base==='#/admin/quiz'){
    toast('info','Đã chuyển vào wizard khóa học','Bài học và bài kiểm tra được quản lý trong màn Quản lý khóa học.');
    location.hash='#/admin/courses';
    return;
  }
  window.scrollTo(0,0);
  // Auth guards
  const needAuth=['#/my-courses','#/learn','#/quiz','#/certificate','#/review','#/profile','#/cart'];
  if(needAuth.includes(base) && !STATE.currentUser){toast('warning','Cần đăng nhập','Vui lòng đăng nhập để tiếp tục');return route('#/login')}
  if(base.startsWith('#/admin') && STATE.currentUser?.role!=='admin'){toast('error','Không có quyền truy cập','Chỉ quản trị viên mới được vào khu vực này');return route('#/')}
  const fn=ROUTES[base]||renderHome;
  fn(parts);
}
window.addEventListener('hashchange',()=>route());

function applyCourseFilter(){
  const q=($('#fSearch')?.value||'').toLowerCase().trim();
  const cat=$('#fCat')?.value||'';
  const lv=$('#fLevel')?.value||'';
  const price=$('#fPrice')?.value||'';
  let list=STATE.courses.filter(c=>{
    if(q && !c.title.toLowerCase().includes(q)) return false;
    if(cat && c.category!==cat) return false;
    if(lv && c.level!==lv) return false;
    if(price==='free' && c.price!==0) return false;
    if(price==='paid' && c.price===0) return false;
    return c.status==='PUBLISHED';
  });
  const grid=$('#courseListGrid');
  grid.innerHTML = list.length?list.map(courseCardHTML).join(''):'<div class="card text-center" style="grid-column:1/-1;padding:60px"><h3>Không tìm thấy khóa học phù hợp</h3><p class="text-muted mt-8">Thử điều chỉnh bộ lọc hoặc tìm với từ khóa khác.</p></div>';
}

function addToCart(courseId){
  const user=STATE.currentUser;
  if(!user){route('#/login');return}
  if(user.role==='admin'){toast('warning','Tài khoản quản trị','Quản trị viên không mua khóa học');return}
  const c=getCourse(courseId);
  if(!c || c.status!=='PUBLISHED'){toast('warning','Khóa học không khả dụng','Khóa học chưa được xuất bản hoặc đã bị ẩn');return}
  if(getEnrollment(courseId)){toast('info','Đã đăng ký','Khóa học đã có trong danh sách của bạn');return}
  if(STATE.cartItems.some(x=>x.userId===user.id && x.courseId===courseId)){
    toast('info','Đã có trong giỏ hàng','Vào giỏ hàng để thanh toán');
    return;
  }
  STATE.cartItems.push({id:'ci_'+uid(),userId:user.id,courseId,addedAt:Date.now()});
  saveState();
  toast('success','Đã thêm vào giỏ hàng',escapeHtml(c.title));
  route(location.hash); // re-render để cập nhật CTA
}
function removeFromCart(itemId){
  STATE.cartItems=STATE.cartItems.filter(x=>x.id!==itemId);
  saveState();
  toast('info','Đã xóa khỏi giỏ hàng');
  renderCart();
}
function renderCart(){
  const user=STATE.currentUser;
  // Filter out invalid items (hidden/deleted courses, or already enrolled)
  const validItems=STATE.cartItems.filter(x=>{
    if(x.userId!==user.id) return false;
    const c=getCourse(x.courseId);
    if(!c || c.status!=='PUBLISHED') return false;
    if(getEnrollment(x.courseId,user.id)) return false;
    return true;
  });
  const total=validItems.reduce((s,x)=>s+(getCourse(x.courseId)?.price||0),0);
  const html = publicHeader() +
    pageBanner('Giỏ hàng của bạn','Xem lại các khóa học và tiến hành thanh toán để bắt đầu học ngay.','cart',`<a href="#/">Trang chủ</a> <span>/</span> <span>Giỏ hàng</span>`) + `
    <section style="padding:40px 0 80px"><div class="container">
      ${validItems.length===0?`<div class="card text-center" style="padding:80px 20px">
        <div style="width:100px;height:100px;margin:0 auto 20px;color:var(--text-muted);opacity:0.5">${SVG_CART}</div>
        <h2>Giỏ hàng của bạn đang trống</h2>
        <p class="text-muted mt-8 mb-24">Khám phá catalog để thêm khóa học vào giỏ hàng.</p>
        <a href="#/courses" class="btn btn-primary btn-lg">Xem tất cả khóa học</a>
      </div>`:`
      <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:start">
        <div>
          <div class="flex between center mb-16"><h3>${validItems.length} khóa học trong giỏ</h3><span class="text-muted text-sm">Cập nhật gần nhất: ${fmtDate(Date.now())}</span></div>
          ${validItems.map(x=>{const c=getCourse(x.courseId);return `<div class="cart-list-item">
            <div class="cart-thumb">${courseThumbSVG(c.thumbStyle)}</div>
            <div class="cart-item-info">
              <h4><a href="#/course/${c.id}" style="color:var(--dark)">${escapeHtml(c.title)}</a></h4>
              <div class="meta">${escapeHtml(c.category)} · ${escapeHtml(c.level)} · ${escapeHtml(c.duration)}</div>
            </div>
            <div class="cart-item-price">${fmtPrice(c.price)}</div>
            <div class="cart-item-remove"><button class="btn btn-ghost btn-sm" onclick="removeFromCart('${x.id}')">Xóa</button></div>
          </div>`}).join('')}
        </div>
        <div class="cart-summary">
          <h3 style="margin-bottom:16px">Tóm tắt đơn hàng</h3>
          <div class="cart-summary-row"><span>Số khóa học</span><b>${validItems.length}</b></div>
          <div class="cart-summary-row"><span>Tạm tính</span><b>${fmtPrice(total)}</b></div>
          <div class="cart-summary-row"><span>Giảm giá</span><b>0 ₫</b></div>
          <div class="cart-summary-row total"><span>Tổng thanh toán</span><b>${fmtPrice(total)}</b></div>
          <button class="btn btn-primary btn-block btn-lg mt-24" onclick="openCheckoutModal()">Thanh toán</button>
          <a href="#/courses" class="btn btn-ghost btn-block mt-8" style="margin-top:8px">Tiếp tục xem khóa học</a>
          <div class="text-xs text-muted text-center mt-16" style="line-height:1.6">Đây là môi trường demo. Thanh toán không phát sinh chi phí thật.</div>
        </div>
      </div>
      `}
    </div></section>` + publicFooter();
  $('#app').innerHTML = html;
}
function openCheckoutModal(){
  const user=STATE.currentUser;
  const validItems=STATE.cartItems.filter(x=>x.userId===user.id && getCourse(x.courseId) && getCourse(x.courseId).status==='PUBLISHED' && !getEnrollment(x.courseId,user.id));
  if(!validItems.length){toast('warning','Giỏ hàng trống');return}
  const total=validItems.reduce((s,x)=>s+(getCourse(x.courseId)?.price||0),0);
  window._checkout={method:'demo'};
  openModal(`<div class="modal" style="max-width:600px">
    <div class="modal-header"><h3>Xác nhận thanh toán</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

      </div>

          <div class="pm-label">Thẻ ngân hàng</div>
        </div>
        <div class="payment-method" data-pm="qr" onclick="pickPayment('qr')">
          <svg viewBox="0 0 24 24" fill="#0057FF"><path d="M3 3h8v8H3zm2 2v4h4V5zm8-2h8v8h-8zm2 2v4h4V5zm-2 8h2v2h-2zm4 0h2v2h-2zm-4 4h2v2h-2zm2 2h2v2h-2zm2-2h2v2h-2zm-8-4h8v2h-8zm-6 0h4v2H5zm0 4h2v2H5zm4 0h2v2H9zm-4 4h4v2H5z"/></svg>
          <div class="pm-label">QR Code</div>
        </div>
        <div class="payment-method selected" data-pm="demo" onclick="pickPayment('demo')">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0057FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <div class="pm-label">Demo thanh toán</div>
        </div>
      </div>
      <div class="text-xs text-muted mt-16" style="line-height:1.6">Đây là môi trường demo phục vụ khóa luận tốt nghiệp. Không tích hợp payment gateway thật.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" onclick="confirmCheckout()">Xác nhận thanh toán ${fmtPrice(total)}</button>
    </div>
  </div>`);
}
function pickPayment(m){
  window._checkout.method=m;
  $$('.payment-method').forEach(el=>el.classList.remove('selected'));
  $(`.payment-method[data-pm="${m}"]`).classList.add('selected');
}
function confirmCheckout(){
  const user=STATE.currentUser;
  const items=STATE.cartItems.filter(x=>x.userId===user.id && getCourse(x.courseId) && getCourse(x.courseId).status==='PUBLISHED' && !getEnrollment(x.courseId,user.id));
  items.forEach(x=>{
    const c=getCourse(x.courseId);
    STATE.enrollments.push({id:'e_'+uid(),userId:user.id,courseId:x.courseId,enrolledAt:Date.now(),progress:{completed:[],total:c.lessons.length}});
  });
  // Xóa các item đã thanh toán
  STATE.cartItems=STATE.cartItems.filter(x=>!(x.userId===user.id && items.some(i=>i.id===x.id)));
  saveState();
  closeModal();
  toast('success','Thanh toán thành công',items.length+' khóa học đã được thêm vào tài khoản');
  setTimeout(()=>route('#/my-courses'),400);
}

function doRegister(e){
  e.preventDefault();
  $$('.form-error').forEach(el=>el.classList.remove('show'));
  const name=$('#regName').value.trim();
  const email=$('#regEmail').value.trim().toLowerCase();
  const phone=$('#regPhone').value.trim();
  const pass=$('#regPass').value;
  const pass2=$('#regPass2').value;
  let ok=true;
  if(!name){$('#err_name').textContent='Vui lòng nhập họ tên';$('#err_name').classList.add('show');ok=false}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('#err_email').textContent='Email không hợp lệ';$('#err_email').classList.add('show');ok=false}
  else if(STATE.users.some(u=>u.email.toLowerCase()===email)){$('#err_email').textContent='Email đã được đăng ký';$('#err_email').classList.add('show');ok=false}
  if(!/^0\d{8,10}$/.test(phone)){$('#err_phone').textContent='Số điện thoại không hợp lệ';$('#err_phone').classList.add('show');ok=false}
  if(pass.length<8){$('#err_pass').textContent='Mật khẩu phải tối thiểu 8 ký tự';$('#err_pass').classList.add('show');ok=false}
  if(pass!==pass2){$('#err_pass2').textContent='Xác nhận mật khẩu không khớp';$('#err_pass2').classList.add('show');ok=false}
  if(!ok) return;
  const u={id:'u_'+uid(),email,password:pass,fullName:name,phone,role:'student',status:'active',createdAt:Date.now()};
  STATE.users.push(u);saveState();
  toast('success','Đăng ký thành công','Bạn có thể đăng nhập ngay bây giờ');
  setTimeout(()=>route('#/login'),400);
}

function markLessonDone(courseId,lessonId){
  const en=getEnrollment(courseId);
  if(!en.progress.completed.includes(lessonId)) en.progress.completed.push(lessonId);
  saveState();
  toast('success','Đã đánh dấu hoàn thành','Tiến độ đã được cập nhật');
  const c=getCourse(courseId);
  const idx=c.lessons.findIndex(l=>l.id===lessonId);
  const next=c.lessons[idx+1];
  if(next) setTimeout(()=>route('#/learn/'+courseId+'/'+next.id),400);
  else{
    if(courseProgress(courseId)===100){toast('info','Bạn đã hoàn thành 100% bài học','Hãy làm bài kiểm tra để nhận chứng chỉ')}
    renderLearn(location.hash.split('/'));
  }
}

function renderQuizForm(){

  $('#app').innerHTML = publicHeader() + `<div class="quiz-wrap">
    <div class="quiz-card">

        <div><b style="color:var(--dark)">Bài kiểm tra cuối khóa</b> · ${escapeHtml(c.title)}</div>

      </div>

          <div class="qnum">Câu ${qi+1}/${q.questions.length}</div>
          <h3>${escapeHtml(qq.q)}</h3>
          <div class="quiz-options">
            ${qq.options.map((opt,oi)=>`<div class="quiz-option" data-q="${qi}" data-o="${oi}" onclick="pickQuizAnswer(${qi},${oi})"><div class="quiz-radio"></div><div>${escapeHtml(opt)}</div></div>`).join('')}
          </div>
        </div>`).join('')}
      </div>
      <div class="flex between center mt-24">
        <button class="btn btn-ghost" onclick="route('#/learn/${s.courseId}')">← Về học tập</button>
        <button class="btn btn-primary btn-lg" id="submitQuiz" onclick="submitQuiz()">Nộp bài</button>
      </div>
    </div>
  </div>` + publicFooter();
}
function pickQuizAnswer(qi,oi){
  const s=window._quizSession;
  if(s.submitted) return;
  s.answers[qi]=oi;
  $$('.quiz-option[data-q="'+qi+'"]').forEach(el=>el.classList.remove('selected'));
  $(`.quiz-option[data-q="${qi}"][data-o="${oi}"]`).classList.add('selected');
}
function submitQuiz(){
  const s=window._quizSession;
  const q=s.quiz;
  if(Object.keys(s.answers).length<q.questions.length){toast('warning','Chưa trả lời hết','Vui lòng chọn đáp án cho tất cả câu hỏi');return}
  let correct=0;
  q.questions.forEach((qq,i)=>{if(s.answers[i]===qq.correct) correct++});
  const score=Math.round(correct/q.questions.length*100);
  const passed=score>=q.passScore;
  STATE.quizResults.push({id:'qr_'+uid(),userId:STATE.currentUser.id,courseId:s.courseId,score,passed,total:q.questions.length,correct,createdAt:Date.now()});
  saveState();
  s.submitted=true;
  const c=getCourse(s.courseId);
  $('#app').innerHTML = publicHeader() + `<div class="quiz-wrap"><div class="quiz-card quiz-result-card">
    <div class="quiz-result-icon ${passed?'pass':'fail'}">${passed?'✓':'!'}</div>
    <div class="quiz-score">${score}%</div>
    <div class="quiz-result-detail">Bạn trả lời đúng <b>${correct}/${q.questions.length}</b> câu · Điểm đạt: <b>${q.passScore}%</b></div>
    <div class="badge ${passed?'badge-success':'badge-danger'}" style="font-size:14px;padding:8px 18px;margin-bottom:24px">${passed?'ĐẠT':'CHƯA ĐẠT'}</div>
    <div>
      ${passed?`<p class="text-muted mb-24">Chúc mừng bạn đã hoàn thành khóa học <b>${escapeHtml(c.title)}</b>! Chứng chỉ đã sẵn sàng.</p>
        <a href="#/certificate/${s.courseId}" class="btn btn-primary btn-lg">Xem chứng chỉ</a>
        <a href="#/review/${s.courseId}" class="btn btn-outline btn-lg" style="margin-left:8px">Đánh giá khóa học</a>`
      :`<p class="text-muted mb-24">Bạn có thể làm lại bài kiểm tra sau khi ôn tập lại các bài học.</p>
        <a href="#/learn/${s.courseId}" class="btn btn-outline btn-lg">Ôn lại bài học</a>
        <button class="btn btn-primary btn-lg" onclick="route('#/quiz/${s.courseId}')" style="margin-left:8px">Làm lại</button>`}
    </div>
  </div></div>` + publicFooter();
}

  if(!en){toast('warning','Bạn chưa đăng ký khóa học này');return route('#/course/'+courseId)}
  const existing = STATE.reviews.find(r=>r.userId===user.id && r.courseId===courseId);
  window._reviewData={rating:existing?existing.rating:5,comment:existing?existing.comment:''};
  $('#app').innerHTML = publicHeader() + `<div class="quiz-wrap"><div class="quiz-card">
    <h2 style="margin-bottom:8px">Đánh giá khóa học</h2>
    <p class="text-muted mb-24">${escapeHtml(c.title)}</p>
    <div class="form-group">
      <label class="form-label">Đánh giá của bạn</label>
      <div id="starPicker" style="font-size:34px;color:var(--warning);cursor:pointer;letter-spacing:4px">
        ${[1,2,3,4,5].map(n=>`<span data-r="${n}" onclick="pickStar(${n})">${n<=window._reviewData.rating?'★':'☆'}</span>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Nhận xét</label>
      <textarea class="form-control" id="reviewComment" placeholder="Chia sẻ trải nghiệm học của bạn...">${escapeHtml(window._reviewData.comment)}</textarea>
    </div>
    <div class="flex between center">
      <button class="btn btn-ghost" onclick="history.back()">← Quay lại</button>
      <button class="btn btn-primary" onclick="submitReview('${courseId}')">${existing?'Cập nhật đánh giá':'Gửi đánh giá'}</button>
    </div>
  </div></div>` + publicFooter();
}
function pickStar(n){
  window._reviewData.rating=n;
  $('#starPicker').innerHTML = [1,2,3,4,5].map(i=>`<span data-r="${i}" onclick="pickStar(${i})">${i<=n?'★':'☆'}</span>`).join('');
}
function submitReview(courseId){
  const user=STATE.currentUser;
  const comment=$('#reviewComment').value.trim();
  if(!comment){toast('warning','Vui lòng nhập nhận xét');return}
  const rating=window._reviewData.rating;
  const existing=STATE.reviews.find(r=>r.userId===user.id && r.courseId===courseId);
  if(existing){existing.rating=rating;existing.comment=comment;existing.createdAt=Date.now()}
  else STATE.reviews.push({id:'r_'+uid(),userId:user.id,userName:user.fullName,courseId,rating,comment,createdAt:Date.now()});
  saveState();
  toast('success','Cảm ơn bạn đã đánh giá','Đánh giá đã được ghi nhận');
  setTimeout(()=>route('#/course/'+courseId),400);
}

      </div>

function saveProfile(){
  const user=STATE.currentUser;
  const name=$('#pfName').value.trim();
  const phone=$('#pfPhone').value.trim();
  if(!name){toast('warning','Họ tên không được để trống');return}
  if(!/^0\d{8,10}$/.test(phone)){toast('warning','Số điện thoại không hợp lệ');return}
  user.fullName=name;user.phone=phone;
  const u=STATE.users.find(x=>x.id===user.id);if(u){u.fullName=name;u.phone=phone}
  saveState();
  toast('success','Đã lưu thay đổi','Thông tin cá nhân đã được cập nhật');
}
function changePass(){
  const user=STATE.currentUser;
  const oldP=$('#pfOldPass').value;
  const np=$('#pfNewPass').value;
  const np2=$('#pfNewPass2').value;
  if(user.password!==oldP){toast('error','Mật khẩu hiện tại không đúng');return}
  if(np.length<8){toast('warning','Mật khẩu mới phải tối thiểu 8 ký tự');return}
  if(np!==np2){toast('warning','Xác nhận mật khẩu không khớp');return}
  user.password=np;
  const u=STATE.users.find(x=>x.id===user.id);if(u) u.password=np;
  saveState();
  $('#pfOldPass').value=$('#pfNewPass').value=$('#pfNewPass2').value='';
  toast('success','Đã đổi mật khẩu','Vui lòng dùng mật khẩu mới lần đăng nhập tiếp theo');
}

function openCategoryModal(oldName=''){
  openModal(`<div class="modal"><div class="modal-header"><h3>${oldName?'Sửa danh mục':'Thêm danh mục'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body"><div class="form-group"><label class="form-label">Tên danh mục</label><input class="form-control" id="catName" value="${escapeHtml(oldName)}"></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveCategory('${escapeHtml(oldName)}')">Lưu</button></div>
  </div>`);
}
function saveCategory(oldName){
  const name=$('#catName').value.trim();
  if(!name){toast('warning','Tên danh mục không được trống');return}
  if(oldName){
    const i=STATE.categories.indexOf(oldName);
    if(i>=0) STATE.categories[i]=name;
    STATE.courses.forEach(c=>{if(c.category===oldName) c.category=name});
  }else{
    if(STATE.categories.includes(name)){toast('warning','Danh mục đã tồn tại');return}
    STATE.categories.push(name);
  }
  saveState();closeModal();toast('success','Đã lưu danh mục');renderCatTable();
}
function deleteCategory(name){
  const used=STATE.courses.filter(c=>c.category===name).length;
  if(used>0){toast('warning','Không thể xóa','Danh mục đang có '+used+' khóa học');return}
  if(!confirm('Xóa danh mục "'+name+'"?')) return;
  STATE.categories=STATE.categories.filter(c=>c!==name);
  saveState();toast('success','Đã xóa danh mục');renderCatTable();
}
