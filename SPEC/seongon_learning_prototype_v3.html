    <div><h2>Quản lý khóa học</h2><p>Tạo mới, chỉnh sửa và xuất bản khóa học. Bài học và bài kiểm tra được thiết lập trong quy trình thêm/sửa khóa học.</p></div>
    <div class="admin-banner-visual">${bannerSVG('courses')}</div>
  </div>
  <div class="table-toolbar">
    <div class="table-search"><input id="crSearch" placeholder="Tìm khóa học theo tên..." oninput="renderCoursesTable()"></div>
    <div class="table-actions"><button class="btn btn-primary" onclick="openCourseWizard()">+ Tạo khóa học mới</button></div>
  </div>
  <div id="coursesTable"></div>`;
  $('#app').innerHTML = adminLayout('courses','Quản lý khóa học',html);
  renderCoursesTable();
}
function renderCoursesTable(){
  const q=($('#crSearch')?.value||'').toLowerCase().trim();
  const list=STATE.courses.filter(c=>!q||c.title.toLowerCase().includes(q)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  $('#coursesTable').innerHTML = `<div class="data-table"><table>
    <thead><tr><th>Khóa học</th><th>Danh mục</th><th>Cấp độ</th><th>Giá</th><th>Bài học</th><th>Câu hỏi</th><th>Đăng ký</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody>${list.map(c=>{
      const en=STATE.enrollments.filter(e=>e.courseId===c.id).length;
      const q=STATE.quizzes[c.id];
      const qCount = q?q.questions.length:0;
      const canPublish = wizCheckEligibility(c).ok;
      const publishBtnLabel = c.status==='PUBLISHED' ? 'Ẩn' : (canPublish ? 'Xuất bản' : '');
      return `<tr>
        <td>
          <div class="flex gap-12 center">
            <div style="width:60px;height:40px;border-radius:6px;overflow:hidden;flex-shrink:0">${courseThumbSVG(c.thumbStyle)}</div>
            <div><b>${escapeHtml(c.title)}</b><div class="text-xs text-muted">${escapeHtml(c.duration||'—')}</div></div>
          </div>
        </td>
        <td><span class="badge badge-primary">${escapeHtml(c.category)}</span></td>
        <td>${escapeHtml(c.level)}</td>
        <td>${fmtPrice(c.price)}</td>
        <td>${c.lessons.length}</td>
        <td>${qCount}</td>
        <td>${en}</td>
        <td><span class="status-pill ${c.status}">${c.status}</span></td>
        <td class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="openCourseWizard('${c.id}')">Sửa</button>
          <button class="btn btn-ghost btn-sm" onclick="previewCourse('${c.id}')">Xem trước</button>
          ${publishBtnLabel?`<button class="btn btn-ghost btn-sm" onclick="toggleCoursePublish('${c.id}')">${publishBtnLabel}</button>`:''}
          <button class="btn btn-danger btn-sm" onclick="deleteCourse('${c.id}')" ${en>0?'disabled title="Không thể xóa - đang có học viên"':''}>Xóa</button>
        </td>
      </tr>`;
    }).join('')||`<tr><td colspan="9" class="text-center text-muted" style="padding:32px">Không có khóa học nào phù hợp</td></tr>`}</tbody>
  </table></div>`;
}
function previewCourse(id){
  const c=getCourse(id);
  if(c.status!=='PUBLISHED'){
    toast('info','Xem trước','Khóa học đang ở trạng thái '+c.status+'. Chế độ preview cho admin.');
  }
  location.hash='#/course/'+id;
}
function toggleCoursePublish(id){
  const c=getCourse(id);
  if(c.status==='PUBLISHED'){
    c.status='HIDDEN';c.updatedAt=Date.now();
    saveState();toast('success','Đã ẩn khóa học');
  }else{
    const check=wizCheckEligibility(c);
    if(!check.ok){toast('warning','Chưa đủ điều kiện xuất bản',check.missing[0]);return}
    c.status='PUBLISHED';c.updatedAt=Date.now();
    saveState();toast('success','Đã xuất bản khóa học');
  }
  renderCoursesTable();
}
function deleteCourse(id){
  const en=STATE.enrollments.filter(e=>e.courseId===id).length;
  if(en>0){toast('warning','Không thể xóa','Khóa học đang có '+en+' học viên đăng ký. Hãy ẩn khóa học thay vì xóa.');return}
  if(!confirm('Xóa khóa học này? Bài học và bài kiểm tra cũng sẽ bị xóa.')) return;
  STATE.courses=STATE.courses.filter(c=>c.id!==id);
  delete STATE.quizzes[id];
  saveState();toast('success','Đã xóa khóa học');renderCoursesTable();
}

/* ============================================================
   WIZARD: TẠO/SỬA KHÓA HỌC (4 bước theo Activity Diagram)
   ============================================================ */
function openCourseWizard(id){
  // Nếu là tạo mới: tạo course draft tạm trong _wizard.draft (chưa lưu vào STATE)
  // Nếu sửa: load course có sẵn
  const isNew = !id;
  let draft;
  if(isNew){
    draft={id:'c_'+uid(),title:'',category:STATE.categories[0],desc:'',level:'Cơ bản',price:0,duration:'',
      status:'DRAFT',thumbStyle:Math.floor(Math.random()*6)+1,lessons:[],students:0,rating:0,reviewCount:0,
      outcomes:[],audience:'',instructor:'SEONGON Academy',createdAt:Date.now(),updatedAt:Date.now()};
  }else{
    draft = JSON.parse(JSON.stringify(getCourse(id)));
  }
  // Đảm bảo có quiz object cho khóa này
  const existingQuiz = STATE.quizzes[draft.id];
  const quizDraft = existingQuiz ? JSON.parse(JSON.stringify(existingQuiz)) : {
    title:'Bài kiểm tra cuối khóa',durationMin:30,passScore:75,maxAttempts:3,questions:[]
  };
  window._wizard = {isNew, courseId:draft.id, draft, quizDraft, currentStep:1, savedToState:!isNew};
  renderWizard();
}
function renderWizard(){
  const w = window._wizard;
  if(!w) return;
  const c = w.draft;
  const steps = [
    {n:1,label:'Thông tin cơ bản'},
    {n:2,label:'Nội dung bài học'},
    {n:3,label:'Bài kiểm tra cuối khóa'},
    {n:4,label:'Kiểm tra & xuất bản'}
  ];
  const stepsHTML = steps.map(s=>{
    const cls = s.n===w.currentStep ? 'active' : (s.n<w.currentStep ? 'done' : '');
    return `<div class="wz-step ${cls}"><div class="wz-num">${s.n}</div><div class="wz-label">${s.label}</div></div>`;
  }).join('');
  let body='';
  if(w.currentStep===1) body=renderWizStep1();
  else if(w.currentStep===2) body=renderWizStep2();
  else if(w.currentStep===3) body=renderWizStep3();
  else if(w.currentStep===4) body=renderWizStep4();
  const footer = renderWizFooter();
  const existing = document.getElementById('wizardRoot');
  const html = `<div class="wizard-overlay" id="wizardRoot">
    <div class="wizard-panel">
      <div class="wizard-header">
        <div><h2>${w.isNew?'Tạo khóa học mới':'Chỉnh sửa khóa học'}${c.title?' — '+escapeHtml(c.title):''}</h2>
          <div class="wz-sub">Trạng thái hiện tại: <span class="status-pill ${c.status}">${c.status}</span></div>
        </div>
        <button class="wizard-close" onclick="closeWizard()" title="Đóng">✕</button>
      </div>
      <div class="wizard-steps">${stepsHTML}</div>
      <div class="wizard-body">${body}</div>
      <div class="wizard-footer">${footer}</div>
    </div>
  </div>`;
  if(existing) existing.outerHTML = html;
  else document.body.insertAdjacentHTML('beforeend', html);
}
function closeWizard(){
  const w = window._wizard;
  if(w && !w.savedToState && (w.draft.title || w.draft.desc)){
    if(!confirm('Đóng wizard? Nội dung chưa lưu sẽ mất.')) return;
  }
  const el = document.getElementById('wizardRoot');
  if(el) el.remove();
  window._wizard = null;
  renderCoursesTable();
}
function wizGoStep(n){
  const w = window._wizard;
  if(n>1 && !w.savedToState){
    toast('warning','Chưa lưu nháp','Hãy hoàn thành bước 1 và nhấn "Lưu nháp" trước khi tiếp tục');
    return;
  }
  w.currentStep = n;
  renderWizard();
}
function renderWizFooter(){
  const w = window._wizard;
  const back = w.currentStep>1 ? `<button class="btn btn-ghost" onclick="wizGoStep(${w.currentStep-1})">← Quay lại</button>` : `<button class="btn btn-ghost" onclick="closeWizard()">Hủy</button>`;
  let right='';
  if(w.currentStep===1){
    right = `<button class="btn btn-outline" onclick="wizSaveStep1()">Lưu nháp</button>
             <button class="btn btn-primary" onclick="wizSaveStep1AndNext()">Lưu nháp & tiếp tục</button>`;
  }else if(w.currentStep===2){
    right = `<button class="btn btn-primary" onclick="wizGoStep(3)">Tiếp tục sang bài kiểm tra →</button>`;
  }else if(w.currentStep===3){
    right = `<button class="btn btn-primary" onclick="wizGoStep(4)">Tiếp tục kiểm tra & xuất bản →</button>`;
  }else if(w.currentStep===4){
    const check = wizCheckEligibility(w.draft);
    const disabled = check.ok ? '' : 'disabled';
    const btnLabel = w.draft.status==='PUBLISHED' ? 'Cập nhật khóa học' : 'Xuất bản khóa học';
    right = `<button class="btn btn-primary" onclick="wizPublish()" ${disabled}>${btnLabel}</button>`;
  }
  const status = `<div class="wz-status">Bước ${w.currentStep}/4 · ${w.savedToState?'Đã lưu':'Chưa lưu vào hệ thống'}</div>`;
  return `<div>${back}</div>${status}<div class="flex gap-8">${right}</div>`;
}

/* ---------- Wizard Step 1: Thông tin cơ bản ---------- */
function renderWizStep1(){
  const c = window._wizard.draft;
  const cats = STATE.categories.map(cat=>`<option ${cat===c.category?'selected':''}>${cat}</option>`).join('');
  const levels = ['Cơ bản','Trung cấp','Nâng cao'].map(l=>`<option ${l===c.level?'selected':''}>${l}</option>`).join('');
  const thumbStyles = [1,2,3,4,5,6];
  return `
    <h3 style="margin-bottom:6px">Bước 1 — Thông tin cơ bản</h3>
    <p class="text-muted mb-24" style="font-size:13px">Nhập các thông tin cơ bản của khóa học. Sau khi lưu nháp, hệ thống tạo khóa học ở trạng thái DRAFT.</p>
    <div class="form-group"><label class="form-label">Tên khóa học *</label><input class="form-control" id="wzTitle" value="${escapeHtml(c.title)}" placeholder="Ví dụ: SEO AI Max Foundation"></div>
    <div class="flex gap-16">
      <div class="form-group" style="flex:2"><label class="form-label">Danh mục *</label><select class="form-control" id="wzCat">${cats}</select></div>
      <div class="form-group" style="flex:1"><label class="form-label">Cấp độ *</label><select class="form-control" id="wzLevel">${levels}</select></div>
    </div>
    <div class="form-group"><label class="form-label">Mô tả khóa học *</label><textarea class="form-control" id="wzDesc" rows="4" placeholder="Mô tả tổng quan về khóa học...">${escapeHtml(c.desc||'')}</textarea></div>
    <div class="flex gap-16">
      <div class="form-group" style="flex:1"><label class="form-label">Giá (VNĐ)</label><input class="form-control" type="number" id="wzPrice" value="${c.price||0}" placeholder="0 = Miễn phí"></div>
      <div class="form-group" style="flex:1"><label class="form-label">Thời lượng</label><input class="form-control" id="wzDur" value="${escapeHtml(c.duration||'')}" placeholder="Ví dụ: 8 giờ"></div>
      <div class="form-group" style="flex:1"><label class="form-label">Giảng viên</label><input class="form-control" id="wzInstructor" value="${escapeHtml(c.instructor||'SEONGON Academy')}"></div>
    </div>
    <div class="form-group"><label class="form-label">Đối tượng phù hợp</label><textarea class="form-control" id="wzAudience" rows="2" placeholder="Ví dụ: Marketer mới, chủ doanh nghiệp...">${escapeHtml(c.audience||'')}</textarea></div>
    <div class="form-group"><label class="form-label">Kết quả học được (mỗi dòng một mục)</label><textarea class="form-control" id="wzOutcomes" rows="3" placeholder="Ví dụ:&#10;Nắm vững nguyên lý SEO&#10;Áp dụng framework AI Max">${escapeHtml((c.outcomes||[]).join('\n'))}</textarea></div>
    <div class="form-group"><label class="form-label">Ảnh bìa (chọn mẫu minh họa)</label>
      <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px">
        ${thumbStyles.map(t=>`<label style="display:block;cursor:pointer">
          <input type="radio" name="wzThumb" value="${t}" ${t===c.thumbStyle?'checked':''} style="display:none">
          <div style="height:60px;border-radius:6px;overflow:hidden;border:2px solid ${t===c.thumbStyle?'var(--primary)':'var(--border)'}" data-wthumb="${t}" onclick="wizPickThumb(${t})">${courseThumbSVG(t)}</div>
        </label>`).join('')}
      </div>
    </div>`;
}
function wizPickThumb(t){
  window._wizard.draft.thumbStyle = t;
  document.querySelectorAll('input[name=wzThumb]').forEach(inp=>{inp.checked = (parseInt(inp.value)===t)});
  document.querySelectorAll('[data-wthumb]').forEach(el=>{el.style.border = '2px solid var(--border)'});
  const active = document.querySelector('[data-wthumb="'+t+'"]');
  if(active) active.style.border='2px solid var(--primary)';
}
function wizCollectStep1(){
  const w = window._wizard;
  const title = $('#wzTitle').value.trim();
  const category = $('#wzCat').value;
  const desc = $('#wzDesc').value.trim();
  const level = $('#wzLevel').value;
  const price = parseInt($('#wzPrice').value)||0;
  const duration = $('#wzDur').value.trim();
  const instructor = $('#wzInstructor').value.trim();
  const audience = $('#wzAudience').value.trim();
  const outcomes = $('#wzOutcomes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const thumbEl = document.querySelector('input[name=wzThumb]:checked');
  const thumbStyle = thumbEl ? parseInt(thumbEl.value) : w.draft.thumbStyle;
  if(!title){toast('warning','Thiếu thông tin','Tên khóa học không được trống');return null}
  if(!category){toast('warning','Thiếu thông tin','Vui lòng chọn danh mục');return null}
  if(!desc){toast('warning','Thiếu thông tin','Vui lòng nhập mô tả khóa học');return null}
  if(!level){toast('warning','Thiếu thông tin','Vui lòng chọn cấp độ');return null}
  Object.assign(w.draft,{title,category,desc,level,price,duration,instructor,audience,outcomes,thumbStyle,updatedAt:Date.now()});
  return w.draft;
}
function wizSaveStep1(){
  const w = window._wizard;
  const data = wizCollectStep1();
  if(!data) return false;
  // Persist vào STATE
  const existing = STATE.courses.find(c=>c.id===data.id);
  if(existing){
    Object.assign(existing,data);
  }else{
    STATE.courses.push(JSON.parse(JSON.stringify(data)));
  }
  // Persist quizDraft
  STATE.quizzes[data.id] = JSON.parse(JSON.stringify(w.quizDraft));
  saveState();
  w.savedToState = true;
  toast('success','Đã lưu bản nháp khóa học','Trạng thái: '+data.status);
  renderWizard();
  return true;
}
function wizSaveStep1AndNext(){
  if(wizSaveStep1()){
    window._wizard.currentStep = 2;
    renderWizard();
  }
}

/* ---------- Wizard Step 2: Bài học ---------- */
function renderWizStep2(){
  const w = window._wizard;
  const c = w.draft;
  return `
    <h3 style="margin-bottom:6px">Bước 2 — Nội dung bài học</h3>
    <p class="text-muted mb-24" style="font-size:13px">Thêm các bài học cho khóa học. Sắp xếp theo trình tự học viên sẽ đi qua.</p>
    <div class="flex between center mb-16">
      <div><b>${c.lessons.length}</b> bài học</div>
      <button class="btn btn-primary btn-sm" onclick="wizOpenLessonForm()">+ Thêm bài học</button>
    </div>
    <div id="wzLessonList">
      ${c.lessons.length ? c.lessons.map((l,i)=>`<div class="lesson-editor-item">
        <div class="lesson-editor-num">${i+1}</div>
        <div class="lesson-editor-info">
          <h4>${escapeHtml(l.title)}</h4>
          <div class="meta">${escapeHtml(l.duration||'—')} ${l.videoUrl?' · Video':''} ${l.material?' · Tài liệu ('+escapeHtml(l.materialType||'file')+')':''}</div>
        </div>
        <div class="lesson-editor-actions">
          <button class="btn btn-ghost btn-sm" onclick="wizMoveLesson(${i},-1)" ${i===0?'disabled':''}>↑</button>

          <button class="btn btn-outline btn-sm" onclick="wizOpenLessonForm(${i})">Sửa</button>
          <button class="btn btn-danger btn-sm" onclick="wizDeleteLesson(${i})">Xóa</button>
        </div>
      </div>`).join('') : `<div class="card text-center" style="padding:40px"><p class="text-muted">Chưa có bài học nào. Nhấn "+ Thêm bài học" để bắt đầu.</p></div>`}
    </div>`;

function wizOpenLessonForm(idx){
  const w = window._wizard;
  const isEdit = typeof idx === 'number';
  const l = isEdit ? w.draft.lessons[idx] : {title:'',desc:'',duration:'',videoUrl:'',material:'',materialType:''};
  openModal(`<div class="modal">
    <div class="modal-header"><h3>${isEdit?'Sửa bài học':'Thêm bài học'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Tiêu đề bài học *</label><input class="form-control" id="lsTitle" value="${escapeHtml(l.title)}"></div>
      <div class="form-group"><label class="form-label">Mô tả</label><textarea class="form-control" id="lsDesc" rows="3">${escapeHtml(l.desc||'')}</textarea></div>
      <div class="flex gap-16">
        <div class="form-group" style="flex:1"><label class="form-label">Thời lượng</label><input class="form-control" id="lsDur" value="${escapeHtml(l.duration||'')}" placeholder="Ví dụ: 12 phút"></div>
        <div class="form-group" style="flex:2"><label class="form-label">Video URL (mp4/mov)</label><input class="form-control" id="lsVideo" value="${escapeHtml(l.videoUrl||'')}" placeholder="https://... hoặc để trống"></div>
      </div>
      <div class="flex gap-16">
        <div class="form-group" style="flex:2"><label class="form-label">Tài liệu đính kèm (tên file demo)</label><input class="form-control" id="lsMat" value="${escapeHtml(l.material||'')}" placeholder="slide-bai-01.pdf"></div>
        <div class="form-group" style="flex:1"><label class="form-label">Loại tài liệu</label><select class="form-control" id="lsMatType">
          <option value="">(không có)</option>
          <option value="pdf" ${l.materialType==='pdf'?'selected':''}>PDF</option>
          <option value="docx" ${l.materialType==='docx'?'selected':''}>DOCX</option>
          <option value="pptx" ${l.materialType==='pptx'?'selected':''}>PPTX</option>
        </select></div>
      </div>
      <div class="text-xs text-muted" style="line-height:1.5">Chỉ chấp nhận định dạng video: <b>mp4</b>, <b>mov</b>; tài liệu: <b>pdf</b>, <b>docx</b>, <b>pptx</b>. Đây là môi trường demo, hệ thống chỉ giả lập kiểm tra định dạng.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Hủy</button>
      <button class="btn btn-primary" onclick="wizSaveLesson(${isEdit?idx:-1})">Lưu bài học</button>
    </div>
  </div>`);
}
function wizSaveLesson(idx){
  const w = window._wizard;
  const title = $('#lsTitle').value.trim();
  const desc = $('#lsDesc').value.trim();
  const duration = $('#lsDur').value.trim();
  const videoUrl = $('#lsVideo').value.trim();
  const material = $('#lsMat').value.trim();
  const materialType = $('#lsMatType').value;
  if(!title){toast('warning','Thiếu thông tin','Tiêu đề bài học không được trống');return}
  // Validation định dạng file demo
  if(videoUrl){
    const ok = /\.(mp4|mov)(\?|$)/i.test(videoUrl) || videoUrl.startsWith('http');
    if(!ok){toast('warning','Định dạng video không hợp lệ','Chỉ chấp nhận mp4, mov');return}
  }
  if(material && !materialType){toast('warning','Thiếu loại tài liệu','Vui lòng chọn loại tài liệu (pdf/docx/pptx)');return}
  if(materialType && !['pdf','docx','pptx'].includes(materialType)){toast('warning','Định dạng tài liệu không hợp lệ');return}
  const data = {title,desc,duration,videoUrl,material,materialType};
  if(idx>=0){
    Object.assign(w.draft.lessons[idx],data);
  }else{
    w.draft.lessons.push({id:'l_'+uid(),...data});
  }
  w.draft.updatedAt = Date.now();
  // Persist ngay
  const existing = STATE.courses.find(c=>c.id===w.draft.id);
  if(existing){existing.lessons = JSON.parse(JSON.stringify(w.draft.lessons));existing.updatedAt=Date.now()}
  saveState();
  closeModal();
  toast('success','Đã lưu bài học');
  renderWizard();
}
function wizDeleteLesson(idx){
  if(!confirm('Xóa bài học này?')) return;
  const w = window._wizard;
  w.draft.lessons.splice(idx,1);
  const existing = STATE.courses.find(c=>c.id===w.draft.id);
  if(existing){existing.lessons = JSON.parse(JSON.stringify(w.draft.lessons));existing.updatedAt=Date.now()}
  saveState();
  toast('success','Đã xóa bài học');
  renderWizard();
}
function wizMoveLesson(idx,dir){
  const w = window._wizard;
  const n = idx+dir;

function wizSaveQuestion(idx){
  const w = window._wizard;
  const content = $('#qnContent').value.trim();
  const options = [0,1,2,3].map(i=>$('#qnOpt'+i).value.trim());
  const correct = parseInt(document.querySelector('input[name=qnCorrect]:checked')?.value ?? 0);

  if(nonEmpty<2){toast('warning','Thiếu đáp án','Mỗi câu hỏi phải có tối thiểu 2 đáp án');return}
  if(!options[correct]){toast('warning','Đáp án đúng bị trống','Vui lòng nhập nội dung cho đáp án đúng đã chọn');return}

  if(idx>=0){

/* ---------- Wizard Step 4: Review & Publish ---------- */
function wizCheckEligibility(course){
  const q = STATE.quizzes[course.id];
  const items = [
    {label:'Có tên khóa học', ok: !!(course.title && course.title.trim())},
    {label:'Có mô tả khóa học', ok: !!(course.desc && course.desc.trim())},
    {label:'Đã chọn danh mục', ok: !!course.category},
    {label:'Có ít nhất 1 bài học', ok: (course.lessons||[]).length>=1},
    {label:'Đã cấu hình bài kiểm tra', ok: !!(q && q.title)},
    {label:'Bài kiểm tra có tối thiểu 5 câu hỏi', ok: !!(q && q.questions && q.questions.length>=5)},
    {label:'Mỗi câu hỏi có đáp án đúng', ok: !!(q && q.questions && q.questions.every(qq=>qq.options[qq.correct]))}
  ];
  const missing = items.filter(x=>!x.ok).map(x=>x.label);
  return {ok: missing.length===0, items, missing};
}

}
function saveQuestion(qid){
  const cid=$('#qCourse').value;
  const quiz=getQuizFor(cid);
  const text=$('#qqText').value.trim();
  if(!text){toast('warning','Câu hỏi không được trống');return}
  const opts=[0,1,2,3].map(i=>$('#qqOpt'+i).value.trim());
  if(opts.some(o=>!o)){toast('warning','Vui lòng nhập đủ 4 đáp án');return}
  const correct=parseInt(document.querySelector('input[name=qqCorrect]:checked')?.value||0);
  const data={q:text,options:opts,correct};
  if(qid) Object.assign(quiz.questions.find(x=>x.id===qid),data);
  else quiz.questions.push({id:'q_'+uid(),...data});
  saveState();closeModal();toast('success','Đã lưu câu hỏi');renderQuizAdmin();
}
function deleteQuestion(qid){
  if(!confirm('Xóa câu hỏi này?')) return;
  const cid=$('#qCourse').value;
  const q=getQuizFor(cid);
  q.questions=q.questions.filter(x=>x.id!==qid);
  saveState();toast('success','Đã xóa câu hỏi');renderQuizAdmin();
}

/* ============================================================
   ADMIN: REVIEWS
   ============================================================ */
function renderAdminReviews(){
  const html=`
  <div class="table-toolbar">
    <div class="text-muted text-sm">Kiểm duyệt các đánh giá của học viên</div>
    <span class="text-muted text-sm">${STATE.reviews.length} đánh giá</span>
  </div>
  <div id="reviewsTable"></div>`;
  $('#app').innerHTML = adminLayout('reviews','Quản lý đánh giá',html);
  renderReviewsTable();
}
function renderReviewsTable(){
  const list=[...STATE.reviews].sort((a,b)=>b.createdAt-a.createdAt);
  $('#reviewsTable').innerHTML = `<div class="data-table"><table>
    <thead><tr><th>Học viên</th><th>Khóa học</th><th>Đánh giá</th><th>Nội dung</th><th>Ngày</th><th></th></tr></thead>
    <tbody>${list.map(r=>{
      const c=getCourse(r.courseId);
      return `<tr>
        <td><b>${escapeHtml(r.userName)}</b></td>
        <td>${escapeHtml(c?.title||'—')}</td>
        <td><span style="color:var(--warning)">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></td>
        <td>${escapeHtml(r.comment)}</td>
        <td>${fmtDate(r.createdAt)}</td>
        <td class="row-actions"><button class="btn btn-danger btn-sm" onclick="deleteReview('${r.id}')">Xóa</button></td>
      </tr>`;
    }).join('')||`<tr><td colspan="6" class="text-center text-muted" style="padding:32px">Chưa có đánh giá nào</td></tr>`}</tbody>
  </table></div>`;
}
function deleteReview(rid){
  if(!confirm('Xóa đánh giá này? (Demo giả lập kiểm duyệt vi phạm)')) return;
  STATE.reviews=STATE.reviews.filter(r=>r.id!==rid);
  saveState();toast('success','Đã xóa đánh giá');renderReviewsTable();
}

/* ============================================================
   ADMIN: BLOG
   ============================================================ */
function renderAdminBlog(){
  const html=`
  <div class="admin-banner">
    <div><h2>Quản lý blog tin tức</h2><p>Tạo, chỉnh sửa và xuất bản các bài viết về xu hướng Search Marketing, giới thiệu công ty, chính sách và câu hỏi thường gặp.</p></div>
    <div class="admin-banner-visual">${bannerSVG('blog')}</div>
  </div>
  <div class="table-toolbar">
    <div class="flex gap-12 center" style="flex:1;flex-wrap:wrap">
      <div class="table-search"><input id="blSearch" placeholder="Tìm bài viết theo tiêu đề..." oninput="renderBlogTable()"></div>
      <select id="blCat" class="form-control" style="width:auto" onchange="renderBlogTable()">
        <option value="">Tất cả danh mục</option>
        ${BLOG_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}
      </select>
      <select id="blStatus" class="form-control" style="width:auto" onchange="renderBlogTable()">
        <option value="">Tất cả trạng thái</option>
        <option value="published">Đã xuất bản</option>
        <option value="draft">Bản nháp</option>
        <option value="hidden">Ẩn</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="openBlogModal()">+ Thêm bài viết</button>
  </div>
  <div id="blogTable"></div>`;
  $('#app').innerHTML = adminLayout('blog','Quản lý blog tin tức',html);
  renderBlogTable();
}
function renderBlogTable(){
  const q=($('#blSearch')?.value||'').toLowerCase().trim();
  const cat=$('#blCat')?.value||'';
  const st=$('#blStatus')?.value||'';
  const list=STATE.blogPosts.filter(p=>{
    if(q && !p.title.toLowerCase().includes(q)) return false;
    if(cat && p.category!==cat) return false;
    if(st && p.status!==st) return false;
    return true;
  }).sort((a,b)=>b.updatedAt-a.updatedAt);
  const stMap={published:['badge-success','Đã xuất bản'],draft:['badge-warning','Bản nháp'],hidden:['badge-gray','Ẩn']};
  $('#blogTable').innerHTML = `<div class="data-table"><table>
    <thead><tr><th>Bài viết</th><th>Danh mục</th><th>Trạng thái</th><th>Ngày cập nhật</th><th></th></tr></thead>
    <tbody>${list.map(p=>`<tr>
      <td>
        <div class="flex gap-12 center">
          <div style="width:60px;height:40px;border-radius:6px;overflow:hidden;flex-shrink:0">${blogThumbSVG(p.thumb)}</div>
          <div><b>${escapeHtml(p.title)}</b><div class="text-xs text-muted">${escapeHtml(p.excerpt.slice(0,80))}${p.excerpt.length>80?'…':''}</div></div>
        </div>
      </td>
      <td><span class="badge badge-primary">${escapeHtml(p.category)}</span></td>
      <td><span class="badge ${stMap[p.status][0]}">${stMap[p.status][1]}</span></td>
      <td>${fmtDate(p.updatedAt)}</td>
      <td class="row-actions">
        <button class="btn btn-outline btn-sm" onclick="openBlogModal('${p.id}')">Sửa</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleBlogPublish('${p.id}')">${p.status==='published'?'Ẩn':'Xuất bản'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteBlogPost('${p.id}')">Xóa</button>
      </td>
    </tr>`).join('')||`<tr><td colspan="5" class="text-center text-muted" style="padding:32px">Không có bài viết nào phù hợp</td></tr>`}</tbody>
  </table></div>`;
}
function openBlogModal(id){
  const p = id ? STATE.blogPosts.find(x=>x.id===id) : {id:'',title:'',category:BLOG_CATEGORIES[0],excerpt:'',content:'',thumb:'ai-search',status:'draft'};
  const thumbOpts=['ai-search','seo-framework','company','policy','faq','content'];
  openModal(`<div class="modal" style="max-width:720px">
    <div class="modal-header"><h3>${id?'Sửa bài viết':'Thêm bài viết'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Tiêu đề *</label><input class="form-control" id="bpTitle" value="${escapeHtml(p.title)}"></div>
      <div class="flex gap-16">
        <div class="form-group" style="flex:1"><label class="form-label">Danh mục *</label><select class="form-control" id="bpCat">${BLOG_CATEGORIES.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="form-group" style="flex:1"><label class="form-label">Trạng thái</label><select class="form-control" id="bpStatus">
          <option value="draft" ${p.status==='draft'?'selected':''}>Bản nháp</option>
          <option value="published" ${p.status==='published'?'selected':''}>Xuất bản</option>
          <option value="hidden" ${p.status==='hidden'?'selected':''}>Ẩn</option>
        </select></div>
      </div>
      <div class="form-group"><label class="form-label">Mô tả ngắn (excerpt)</label><textarea class="form-control" id="bpExcerpt" rows="2">${escapeHtml(p.excerpt)}</textarea></div>
      <div class="form-group"><label class="form-label">Nội dung *</label><textarea class="form-control" id="bpContent" style="min-height:180px">${escapeHtml(p.content)}</textarea><div class="text-xs text-muted mt-8">Xuống dòng đôi để ngắt đoạn</div></div>
      <div class="form-group"><label class="form-label">Mẫu ảnh thumbnail</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
          ${thumbOpts.map(t=>`<label style="display:block;cursor:pointer">
            <input type="radio" name="bpThumb" value="${t}" ${t===p.thumb?'checked':''} style="display:none">
            <div style="height:60px;border-radius:8px;overflow:hidden;border:2px solid ${t===p.thumb?'var(--primary)':'var(--border)'}" data-thumb="${t}">${blogThumbSVG(t)}</div>
          </label>`).join('')}
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveBlogPost('${id||''}')">Lưu bài viết</button></div>
  </div>`);
  // Thumbnail selection UI enhancement
  $$('input[name=bpThumb]').forEach(inp=>{
    inp.addEventListener('change',()=>{
      $$('[data-thumb]').forEach(el=>el.style.border='2px solid var(--border)');
      $(`[data-thumb="${inp.value}"]`).style.border='2px solid var(--primary)';
    });
  });
}
function saveBlogPost(id){
  const title=$('#bpTitle').value.trim();
  const cat=$('#bpCat').value;
  const excerpt=$('#bpExcerpt').value.trim();
  const content=$('#bpContent').value.trim();
  const status=$('#bpStatus').value;
  const thumb=document.querySelector('input[name=bpThumb]:checked')?.value||'ai-search';
  if(!title){toast('warning','Tiêu đề không được trống');return}
  if(!cat){toast('warning','Vui lòng chọn danh mục');return}
  if(!content){toast('warning','Nội dung không được trống');return}
  const now=Date.now();
  if(id){
    const p=STATE.blogPosts.find(x=>x.id===id);
    Object.assign(p,{title,category:cat,excerpt,content,status,thumb,updatedAt:now});
  }else{
    STATE.blogPosts.push({id:'b_'+uid(),title,category:cat,excerpt,content,status,thumb,createdAt:now,updatedAt:now});
  }
  saveState();closeModal();toast('success','Đã lưu bài viết');renderBlogTable();
}
function toggleBlogPublish(id){
  const p=STATE.blogPosts.find(x=>x.id===id);
  p.status = p.status==='published' ? 'hidden' : 'published';
  p.updatedAt=Date.now();
  saveState();toast('success',p.status==='published'?'Đã xuất bản':'Đã ẩn bài viết');renderBlogTable();
}
function deleteBlogPost(id){
  if(!confirm('Xóa bài viết này?')) return;
  STATE.blogPosts=STATE.blogPosts.filter(p=>p.id!==id);
  saveState();toast('success','Đã xóa bài viết');renderBlogTable();
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
route();
</script>
